services:
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      APP_ENVIRONMENT: local
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_CORS_ORIGINS: '["http://localhost:5173"]'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_OPENAI_MODEL: ${APP_OPENAI_MODEL:-gpt-5-mini}
      APP_OPENAI_TIMEOUT_SECONDS: ${APP_OPENAI_TIMEOUT_SECONDS:-20}
      APP_OPENAI_MAX_RETRIES: ${APP_OPENAI_MAX_RETRIES:-1}
      APP_OPENAI_MAX_OUTPUT_TOKENS: ${APP_OPENAI_MAX_OUTPUT_TOKENS:-4096}
      APP_RAG_MIN_SIMILARITY: ${APP_RAG_MIN_SIMILARITY:-0.3}
      APP_CHAT_DEADLINE_SECONDS: ${APP_CHAT_DEADLINE_SECONDS:-45}
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-copilot}:${POSTGRES_PASSWORD:-copilot_local_only}@postgres:5432/${POSTGRES_DB:-copilot}
    command: ["sh", "-c", ".venv/bin/alembic upgrade head && exec .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot_local_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["mlflow_data:/mlflow"]
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--artifacts-destination", "/mlflow/artifacts", "--serve-artifacts"]

volumes:
  postgres_data:
  redis_data:
  mlflow_data:
