[project]
name = "ai-operations-copilot-backend"
version = "0.1.0"
description = "Operations copilot API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.8,<3",
    "uvicorn>=0.34,<1",
    "pgvector>=0.4,<1",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
